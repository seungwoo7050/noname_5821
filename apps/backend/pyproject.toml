[project]
name = "clear-time-backend"
version = "0.1.0"
description = "Canonical Clear Time data and public read API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.17",
  "jsonschema==4.26.0",
  "psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = ["pip-audit==2.10.1", "ruff==0.16.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]
ignore = ["S101"]
